[project]
name = "llm-gateway"
version = "1.0.0"
description = "LLM Gateway POC — Propeller Technothon Problem Statement 4"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths    = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select  = ["E", "F", "I"]
ignore  = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/api/main.py" = ["E402"]
