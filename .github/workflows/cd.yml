name: CD

on:
  push:
    tags: ["v*.*.*"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t llm-gateway:${{ github.ref_name }} .

      - name: Run smoke test on container
        run: |
          docker run -d --name gateway-test \
            -e API_KEYS=free-key-001:free \
            -p 8000:8000 \
            llm-gateway:${{ github.ref_name }}
          sleep 5
          curl -f http://localhost:8000/health
          docker stop gateway-test

      - name: Tag as latest
        run: docker tag llm-gateway:${{ github.ref_name }} llm-gateway:latest
