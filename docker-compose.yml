version: "3.9"

services:
  gateway:
    build: .
    container_name: llm-gateway
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data       # persist cache + analytics across restarts
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
